packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@astryxdesign/cli': 0.5.0
  '@astryxdesign/core': 0.5.0
  '@astryxdesign/theme-neutral': 0.5.0
  '@stylexjs/stylex': 0.19.0
  "@types/node": 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.0
  idb: 8.0.3
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitest: 4.1.11
  webmcp-types: 0.1.5
  zod: 4.4.3

overrides:
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  esbuild: true
